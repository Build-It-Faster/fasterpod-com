<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build It Faster — Podcast</title>
  <meta name="description" content="A podcast about the tools and workflows we use to build software.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0b1021',
            accent: '#f3c614',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer base {
      body {
        @apply bg-ink text-slate-100 antialiased;
      }
      a {
        @apply transition-colors duration-150;
      }
      a:focus-visible {
        outline: 2px solid #f3c614;
        outline-offset: 5px;
      }
    }
    @layer components {
      .pill {
        @apply inline-flex min-h-12 items-center gap-3 rounded-lg border border-white/20 px-5 py-3 text-sm font-medium;
      }
      .social-link {
        @apply inline-flex min-h-11 items-center justify-center text-sm text-slate-400 hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/60 focus-visible:ring-offset-2 focus-visible:ring-offset-ink;
      }
    }
  </style>
</head>
<body class="min-h-screen">
  <main class="relative mx-auto flex min-h-screen max-w-7xl flex-col justify-center px-6 py-8 sm:px-10 sm:py-12 lg:px-16">
    <div aria-hidden="true" class="mb-12 flex items-center gap-2 sm:mb-16">
      <span class="h-2 w-8 bg-accent"></span>
      <span class="h-2 w-4 bg-accent/60"></span>
      <span class="h-2 w-2 bg-accent/30"></span>
      <span class="ml-4 h-px flex-1 bg-white/15"></span>
    </div>
    <div class="z-10 flex flex-col gap-10 lg:gap-12">
      <div class="grid gap-12 lg:grid-cols-[0.85fr_1.15fr] lg:items-center lg:gap-16">
        <header class="flex flex-col gap-6">
          <h1 class="font-display text-[clamp(3.75rem,8vw,7rem)] font-semibold leading-[0.9] tracking-[-0.065em] text-white">
            Build It<br><span class="text-accent">Faster.</span>
          </h1>
          <p class="max-w-sm text-lg leading-relaxed text-slate-300 sm:text-xl">
            A podcast about the tools and workflows we use to build software.
          </p>
          <div class="mt-2 flex flex-wrap gap-3">
            <a class="pill bg-accent text-ink hover:bg-[#ffdc50]" href="https://www.youtube.com/@BuildFasterPod" target="_blank" rel="noreferrer">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              Watch on YouTube
            </a>
            <a class="pill text-white hover:border-white/50 hover:bg-white/5" href="https://open.spotify.com/show/28PWQhraVCBTSpbknJ" target="_blank" rel="noreferrer">
              Listen on Spotify
            </a>
          </div>
        </header>
        <section aria-labelledby="featured-episode-heading" class="flex flex-col gap-4">
          <div class="flex items-center justify-between gap-4">
            <h2 id="featured-episode-heading" class="font-display text-lg font-medium text-slate-200">Latest video</h2>
          </div>
          <div class="aspect-video overflow-hidden rounded-xl border border-white/15 bg-black shadow-[0_20px_60px_-20px_rgba(0,0,0,0.65)]">
            <!-- Starts with the first playlist item. Keep Longs ordered newest first on YouTube. -->
            <iframe
              class="h-full w-full"
              src="https://www.youtube.com/embed?listType=playlist&amp;list=PLbDGFJVfiANg"
              title="Build It Faster — latest video"
              loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
          </div>
        </section>
      </div>
      <nav aria-label="More from Build It Faster" class="mt-2 flex gap-7 border-t border-white/15 pt-5">
        <a class="social-link" href="https://x.com/buildfasterpod" target="_blank" rel="noreferrer">X</a>
        <a class="social-link" href="https://www.tiktok.com/@builditfaster" target="_blank" rel="noreferrer">TikTok</a>
        <a class="social-link" href="https://substack.com/@buildfasterpod" target="_blank" rel="noreferrer">Substack</a>
      </nav>
    </div>
  </main>
</body>
</html>
